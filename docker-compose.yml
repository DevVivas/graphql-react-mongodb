services:

  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: src/Dockerfile
    restart: unless-stopped
    command: ["node", "src/index.js"]
    environment:
      PORT: ${PORT}
      DBPORT: ${MONGO_HOST}:${MONGO_PORT}
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    restart: unless-stopped
    environment:
      VITE_GRAPHQL_URI: ${VITE_GRAPHQL_URI}
    command: >-
      sh -c "corepack enable && corepack prepare pnpm@12.5.1 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter client exec vite --host 0.0.0.0"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - client_node_modules:/app/frontend/client/node_modules
    ports:
      - "5173:5173"

volumes:
  mongo_data:
  frontend_node_modules:
  client_node_modules:
